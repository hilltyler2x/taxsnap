<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TaxSnap</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f9fafb;font-family:-apple-system,system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
    .icon{width:56px;height:56px;background:#1D9E75;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px}
    h1{font-size:18px;font-weight:600;color:#111;margin:0 0 8px}
    p{font-size:14px;color:#6b7280;margin:0 0 24px;line-height:1.5}
    button{background:#1D9E75;color:#fff;border:0;border-radius:12px;padding:12px 32px;font-size:15px;font-weight:500}
  </style>
</head>
<body>
  <div>
    <div class="icon">📄</div>
    <h1>You're offline</h1>
    <p>TaxSnap needs an internet connection to load your receipts.<br>Check your signal or Wi-Fi and try again.</p>
    <button onclick="retry()">Try again</button>
  </div>
  <script>
    function retry() { window.location.href = "https://taxsnap-jet.vercel.app/dashboard" }
    window.addEventListener("online", retry)
  </script>
</body>
</html>
